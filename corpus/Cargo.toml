[package]
name = "rt"
version = "0.0.0"
edition = "2024"
autoexamples = false
autotests = false
autobins = false

[lib]
path = "src/lib.rs"

[dependencies]
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher", "inline-more"] }
indexmap = { version = "2.14.2", default-features = false }
smallvec = { version = "1.16.3", default-features = false }
arrayvec = { version = "0.7.8", default-features = false }
tinyvec = { version = "1.13.3", default-features = false, features = ["alloc"] }
heapless = { version = "0.9.3", default-features = false }
slab = { version = "0.4.12", default-features = false }
bitflags = { version = "2.13.2", default-features = false }
fixedbitset = { version = "0.5.7", default-features = false }
bitvec = { version = "1.1.1", default-features = false, features = ["alloc"] }
itertools = { version = "0.15.0", default-features = false, features = ["use_alloc"] }
either = { version = "1.19.0", default-features = false }
memchr = { version = "2.8.3", default-features = false }
byteorder = { version = "1.5.0", default-features = false }
fnv = { version = "1.0.7", default-features = false }
ahash = { version = "0.8.12", default-features = false }
hash32 = { version = "1.0.0", default-features = false }
crc32fast = { version = "1.5.3", default-features = false }
crc = { version = "3.4.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
blake2 = { version = "0.11.0", default-features = false }
siphasher = { version = "1.0.4", default-features = false }
rand_core = { version = "0.10.1", default-features = false }
rand_xoshiro = { version = "0.8.1", default-features = false }
rand_pcg = { version = "0.10.2", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
num-integer = { version = "0.1.47", default-features = false }
itoa = { version = "1.0.18", default-features = false }
nom = { version = "8.0.0", default-features = false, features = ["alloc"] }
winnow = { version = "1.0.4", default-features = false, features = ["alloc", "parser", "ascii", "binary"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
spin = { version = "0.12.3", default-features = false, features = ["mutex", "spin_mutex", "rwlock", "once", "lazy"] }
once_cell = { version = "1.21.4", default-features = false, features = ["race", "alloc"] }
static_assertions = { version = "1.1.0", default-features = false }
scopeguard = { version = "1.2.0", default-features = false }
petgraph = { version = "0.8.3", default-features = false, features = ["graphmap", "stable_graph"] }
priority-queue = { version = "2.7.0", default-features = false }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
lz4_flex = { version = "0.14.0", default-features = false, features = ["alloc", "safe-encode", "safe-decode"] }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
uuid = { version = "1.28.0", default-features = false }
semver = { version = "1.0.28", default-features = false }
bytes = { version = "1.12.1", default-features = false }
bumpalo = { version = "3.20.3", default-features = false, features = ["collections", "boxed"] }
slotmap = { version = "1.1.1", default-features = false }
aho-corasick = { version = "1.1.5", default-features = false }
regex-automata = { version = "0.4.18", default-features = false, features = ["alloc", "syntax", "meta", "nfa-pikevm", "nfa-backtrack"] }
unicode-segmentation = { version = "1.13.3", default-features = false }
unicode-normalization = { version = "0.1.26", default-features = false }
thiserror = { version = "2.0.21", default-features = false }
anyhow = { version = "1.0.104", default-features = false }
bytemuck = { version = "1.25.2", default-features = false, features = ["derive"] }
crossbeam-queue = { version = "0.3.14", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
libm = { version = "0.2.16", default-features = false }
ryu = { version = "1.0.23", default-features = false }
fixed = { version = "1.31.0", default-features = false }
chacha20 = { version = "0.10.2", default-features = false, features = ["cipher"] }
aes = { version = "0.9.3", default-features = false }
hmac = { version = "0.13.0", default-features = false }
sha1 = { version = "0.11.0", default-features = false }
sha3 = { version = "0.12.0", default-features = false }
md-5 = { version = "0.11.0", default-features = false }
rand = { version = "0.10.3", default-features = false, features = ["alloc"] }
rand_chacha = { version = "0.10.0", default-features = false }
minicbor = { version = "2.3.1", default-features = false, features = ["alloc", "derive"] }
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
num_enum = { version = "0.7.6", default-features = false }
smol_str = { version = "0.3.7", default-features = false }
glam = { version = "0.34.1", default-features = false, features = ["libm"] }
num-bigint = { version = "0.5.1", default-features = false }
num-rational = { version = "0.4.2", default-features = false }
adler2 = { version = "2.0.1", default-features = false }

[profile.release]
opt-level = 3
debug = 2
panic = "unwind"
codegen-units = 1

[[example]]
name = "a_btree"
path = "tests-bpf/a_btree.rs"
crate-type = ["rlib"]

