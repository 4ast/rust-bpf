[package]
name = "bpf-postproc"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bpf-postproc"
path = "src/main.rs"

# Exactly one llvm-NN feature must be on, and it has to match the LLVM that
# rustc itself was built against -- see LLVM_DIR in the top-level Makefile.
[features]
default = ["llvm-23"]
llvm-22 = ["dep:llvm-sys-22"]
llvm-23 = ["dep:llvm-sys-23"]

[dependencies]
gimli = "0.32"
thiserror = "2"
llvm-sys-22 = { package = "llvm-sys", features = [
    "disable-alltargets-init",
], version = "221.0.1", optional = true }
llvm-sys-23 = { package = "llvm-sys", features = [
    "disable-alltargets-init",
], version = "231.0.0", optional = true }
