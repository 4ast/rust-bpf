[package]
name = "rt"
version = "0.0.0"
edition = "2024"
autoexamples = false
autotests = false
autobins = false

[lib]
path = "src/lib.rs"

[dependencies]

[profile.release]
opt-level = 3
debug = 2
panic = "unwind"
codegen-units = 1

[[example]]
name = "a_btree"
path = "tests-bpf/a_btree.rs"
crate-type = ["rlib"]

